<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DrawRun — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 400px; }
    .logo {
      width: 80px;
      height: 80px;
      background: #3b82f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      font-size: 1.8rem;
      font-weight: 900;
      color: #fff;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #9ca3af; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    .status {
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #6b7280;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      margin-right: 0.5rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">DR</div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      DrawRun nécessite une connexion internet pour charger vos données.
      Vérifiez votre connexion et réessayez.
    </p>
    <button onclick="window.location.reload()">
      Réessayer
    </button>
    <div class="status">
      <span class="dot"></span>
      Pas de connexion internet
    </div>
  </div>
  <script>
    // Recharger automatiquement quand la connexion revient
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
