name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Run backend tests
        run: |
          cd backend
          npm test
        env:
          NODE_ENV: test
          DATA_DIR: ./test-data
          JWT_SECRET: test-secret-key-for-ci-do-not-use-in-production
          CREDENTIALS_SECRET: test-credentials-secret-for-ci-only

      - name: Run backend linting
        run: |
          cd backend
          npm run lint || true

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Run frontend linting
        run: |
          cd frontend
          pnpm lint || true

      - name: Run frontend tests
        run: |
          cd frontend
          pnpm test -- run

      - name: Build frontend
        run: |
          cd frontend
          pnpm build

  # Run in parallel
  test-and-lint:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: All tests passed
        run: echo "✅ All CI checks passed!"
