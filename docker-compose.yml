version: '3.8'

# ============================================================================
# DOCKER COMPOSE - DrawRun Full Stack
# ============================================================================
# 
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose down            # Stop all services
#   docker-compose logs -f backend # View backend logs
#   docker-compose build --no-cache # Rebuild images
#   docker-compose exec backend sh # Enter backend container
#
# ============================================================================

services:
  # ==========================================================================
  # BACKEND SERVICE
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drawrun-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET}
      - CREDENTIALS_SECRET=${CREDENTIALS_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001}
      - LOG_LEVEL=info
      - LOG_DIR=/logs
      - REDIS_URL=redis://redis:6379
      - TOTP_ISSUER=DrawRun
    volumes:
      # Persistent data
      - ./DrawRun-Data:/data:rw
      # Logs
      - ./backend/logs:/logs:rw
      # Uploads
      - ./backend/uploads:/app/uploads:rw
    depends_on:
      - redis
    networks:
      - drawrun-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # FRONTEND SERVICE
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: drawrun-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3000
    depends_on:
      - backend
    networks:
      - drawrun-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==========================================================================
  # REDIS SERVICE
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: drawrun-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data:rw
    command: redis-server --appendonly yes
    networks:
      - drawrun-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # NGINX SERVICE (Optional - for production)
  # ==========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: drawrun-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - drawrun-network
    profiles:
      - production

  # ==========================================================================
  # PROMETHEUS SERVICE (Optional - for monitoring)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: drawrun-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-data:/prometheus:rw
    networks:
      - drawrun-network
    profiles:
      - monitoring

  # ==========================================================================
  # GRAFANA SERVICE (Optional - for monitoring)
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: drawrun-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana:rw
    depends_on:
      - prometheus
    networks:
      - drawrun-network
    profiles:
      - monitoring

# ==========================================================================
# NETWORKS
# ==========================================================================
networks:
  drawrun-network:
    driver: bridge

# ==========================================================================
# VOLUMES
# ==========================================================================
volumes:
  redis-data:
  prometheus-data:
  grafana-data:
